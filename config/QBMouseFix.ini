; QBMouseFix - Quantum Break raw input mouse fix
; Keep this file next to QBMouseFix.asi (the game's dx11 folder). Every setting has a default, so a
; missing line keeps the default behavior described here. Hotkeys work while the game window is focused.

[MouseFix]
; 1 = mouse movement latched while the game skips a world update is added to the next latch instead of
;     replacing it, so several mouse reports per frame add up (required by [RawInput]). 0 = original behavior.
Enabled=1
; Also keep mouse wheel notches that would otherwise be lost.
CarryWheel=1
; Movement older than this (ms) is still dropped, so pausing/loading can't cause a camera jump.
MaxCarryMs=100
; Key that toggles the whole fix on/off in game, for comparison (virtual-key code; 0x77 = F8, 0 = no key).
ToggleKey=0x77

[RawInput]
; 1 = read the mouse on a dedicated thread at its full polling rate and hand every report to the game each
;     time it reads input. Without this the game only receives mouse data when its window thread pumps
;     messages (~115 times/s), so many frames get no camera movement (the "stepped" feel).
; The toggle key switches this together with [MouseFix].
Enabled=1

[Sensitivity]
; Multipliers on mouse look speed, applied on top of the in-game sensitivity setting (which only has 10% steps).
; 1.0 = unchanged. Speed = Global * X normally and Global * AimX while fully aimed (same for Y); in between,
; the value fades with the camera zoom (see AimBlend).
Global=1.0
; Normal camera / hip fire.
X=1.0
Y=1.0
; While aiming. The game already slows the camera while aiming; these apply on top of that.
; About 3.0 makes aiming turn roughly as fast as the normal camera.
AimX=1.0
AimY=1.0
; How aiming is detected:
;   1 = aim key held AND camera zoomed in (instant in and out; ignores the key when it doesn't zoom)
;   0 = camera zoom only (use with toggle-aim: ends as soon as the zoom starts easing back out)
;   2 = aim key only
AimDetection=1
; Aim key as a virtual-key code (0x02 = right mouse button, 0x05/0x06 = side buttons).
AimKey=0x02
; Camera zoom below this counts as zoomed in (1.0 = not zoomed; [Log] Stats=1 prints zoom=[min..max]).
AimZoomThreshold=0.99
; Mode 0 only: aiming ends once the zoom rises this much above its lowest value while aiming.
AimExitZoomRise=0.02
; 1 = the aim values fade in with the zoom-in (like the game's own aim slowdown) instead of switching at once.
AimBlend=1
; 1 = after aiming ends they also fade back out with the zoom-out; 0 = switch back to the hip values at once.
; Both fades follow the camera zoom, so they match the game's own zoom-in and zoom-out durations.
AimBlendOut=1
; Zoom value at which the aim values fully apply (a finished zoom-in is 0.35).
AimFullZoom=0.35
; Key that re-reads this section from the ini while playing (0x79 = F10, 0 = no key).
ReloadKey=0x79

[Latency]
; Maximum number of frames the CPU may queue ahead of the GPU. The game leaves the DirectX 11 default (3),
; which adds input lag whenever the game is GPU-bound. 1 = lowest latency, 0 = leave the game's setting.
MaxFrameLatency=1
; Key that toggles between this value and the game's default, for comparison (0x78 = F9, 0 = no key).
ToggleKey=0x78

[Log]
; Writes QBMouseFix.log next to the plugin: which hooks were installed or skipped (and why), hotkey presses.
Enabled=1
; 1 = also log input statistics every IntervalMs (development and bug reports; the log grows a few MB per hour).
Stats=0
IntervalMs=1000
